<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 120" width="580" height="120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="hGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#172554" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="hAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="hShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ===== ICON (100x100) ===== -->
  <g transform="translate(10, 10)">
    <circle cx="50" cy="50" r="42" fill="url(#hGlow)"/>

    <polygon points="50,18 95,44 95,78 50,104 5,78 5,44" 
             fill="url(#hBody)" filter="url(#hShadow)" stroke="#2563eb" stroke-width="1.5"/>

    <polygon points="50,28 85,49 85,73 50,94 15,73 15,49" 
             fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.35"/>

    <!-- Nodes -->
    <circle cx="28" cy="48" r="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="28" cy="48" r="3" fill="#60a5fa"/>

    <circle cx="50" cy="35" r="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="50" cy="35" r="3" fill="#60a5fa"/>

    <circle cx="72" cy="48" r="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="72" cy="48" r="3" fill="#60a5fa"/>

    <circle cx="28" cy="74" r="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="28" cy="74" r="3" fill="#60a5fa"/>

    <circle cx="72" cy="74" r="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="72" cy="74" r="3" fill="#60a5fa"/>

    <!-- Lines -->
    <line x1="28" y1="48" x2="50" y2="35" stroke="url(#hAccent)" stroke-width="2" stroke-linecap="round"/>
    <line x1="50" y1="35" x2="72" y2="48" stroke="url(#hAccent)" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="48" x2="28" y2="74" stroke="url(#hAccent)" stroke-width="2" stroke-linecap="round"/>
    <line x1="72" y1="48" x2="72" y2="74" stroke="url(#hAccent)" stroke-width="2" stroke-linecap="round"/>

    <line x1="28" y1="61" x2="72" y2="61" stroke="#60a5fa" stroke-width="1" opacity="0.25" stroke-linecap="round"/>

    <circle cx="50" cy="85" r="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="50" cy="85" r="2.5" fill="#fbbf24"/>
  </g>

  <!-- ===== WORDMARK ===== -->
  <text x="130" y="52" font-family="'Source Serif 4', Georgia, Cambria, 'Times New Roman', Times, serif" font-size="38" font-weight="800" fill="#2563eb" letter-spacing="-0.5">Nexus</text>
  <text x="130" y="92" font-family="'Source Serif 4', Georgia, Cambria, 'Times New Roman', Times, serif" font-size="38" font-weight="300" fill="#3b82f6" letter-spacing="2">Forge</text>

  <!-- Accent line -->
  <rect x="130" y="100" width="78" height="2.5" rx="1.25" fill="#3b82f6" opacity="0.7"/>
</svg>